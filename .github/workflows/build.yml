name: build-docker
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Docker 构建
        run: docker build -t luantiweb .
      - name: 取出产物
        run: |
          docker create --name out luantiweb
          docker cp out:/luanti-wasm/www ./www
          docker rm out
      - name: 体积报告
        run: |
          du -sh www
          find . -name '*.wasm' -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: luanti-web
          path: www/
