name: build-native3
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      ac_cv_sizeof_wchar_t: 4
      ac_cv_sizeof_long: 4
      ac_cv_sizeof_long_long: 8
      ac_cv_sizeof_void_p: 4
      ac_cv_sizeof_int: 4
      ac_cv_sizeof_short: 2
      ac_cv_sizeof_char: 1
      ac_cv_c_bigendian: no
      ac_cv_type_wchar_t: yes
      ac_cv_func_wcrtomb: yes
      ac_cv_func_wcslen: yes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --version
      - run: sudo apt-get update && sudo apt-get install -y wget python3 build-essential cmake tclsh zip zstd gettext patch pkg-config
      - name: 修补 libzip 强制静态库
        run: |
          sed -i 's#-DCMAKE_INSTALL_PREFIX="\$INSTALL_DIR"#-DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" -DBUILD_SHARED_LIBS=OFF -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF#' build_libzip.sh
          grep -n "BUILD_SHARED_LIBS" build_libzip.sh
      - uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-608
      - run: ./build_all.sh
      - run: du -sh www; find . -name '*.wasm' -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: luanti-web
          path: www/
